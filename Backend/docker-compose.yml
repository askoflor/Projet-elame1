services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/backend_db
      DB_USERNAME: backend
      DB_PASSWORD: backend123
    depends_on:
      - db
    # NOTE: this is a monolith-first setup. When this application is later
    # split into microservices (auth-service, user-service,
    # availability-service, booking-service, search-service,
    # notification-service, api-gateway, config-server, discovery-service),
    # each one becomes its own service block here, with its own database.
    # For now: a single app container against a single database.

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: backend_db
      MYSQL_USER: backend
      MYSQL_PASSWORD: backend123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - backend_mysqldata:/var/lib/mysql

volumes:
  backend_mysqldata:
