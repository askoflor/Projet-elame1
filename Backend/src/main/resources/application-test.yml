spring:
  datasource:
    url: jdbc:h2:mem:backend_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  mail:
    # Hote local injoignable : l'envoi echoue immediatement (connexion refusee)
    # au lieu de tenter smtp.gmail.com (valeur par defaut de application.yml),
    # qui ferait attendre un timeout reseau a chaque test d'inscription.
    # EmailService avale deja les echecs d'envoi, donc l'inscription reussit
    # normalement malgre cet echec.
    host: localhost
    port: 1

logging:
  level:
    com.renkotechnologie.backend: DEBUG
