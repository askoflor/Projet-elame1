spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # "update" le temps que le projet n'ait pas d'outil de migration versionnee
      # (Flyway/Liquibase). A repasser en "validate" une fois celui-ci en place,
      # pour eviter que Hibernate modifie le schema de production automatiquement.
      ddl-auto: update
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: WARN
    com.renkotechnologie.backend: INFO
