spring:
  application:
    name: backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:florentassakoj@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  jwt:
    # IMPORTANT : definir JWT_SECRET en production (.env), la valeur par defaut
    # ci-dessous ne convient qu'au developpement local.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-32chars-min}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION_MS:86400000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  mail:
    verification-base-url: ${APP_VERIFICATION_BASE_URL:http://localhost:8080/api/v1/auth/verify-email}

logging:
  level:
    root: INFO
