services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-backend_db}
      MYSQL_USER: ${MYSQL_USER:-backend}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-backend_db}
      DB_USERNAME: ${MYSQL_USER:-backend}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      APP_STORAGE_DIR: /app/storage
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      MAIL_USERNAME: ${MAIL_USERNAME:-florentassakoj@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?set MAIL_PASSWORD in .env}
      APP_VERIFICATION_BASE_URL: ${API_BASE_URL:-http://localhost:8080}/api/v1/auth/verify-email
      APP_RESET_PASSWORD_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}/reset-password
    # Plus expose publiquement sur l'hote : seul nginx (ci-dessous) est
    # joignable depuis l'exterieur, et route vers ce conteneur en interne.
    expose:
      - "8080"
    volumes:
      - ${STORAGE_HOST_PATH:-/opt/projet-elame/storage}:/app/storage
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - db

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - ${MINIO_HOST_PATH:-/opt/projet-elame/storage/minio/data}:/data

  frontend:
    build:
      context: ./frontend-X2
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
        USE_MOCK_BACKEND: ${USE_MOCK_BACKEND:-false}
    restart: unless-stopped
    # Idem backend : accessible uniquement via nginx, pas directement depuis l'hote.
    expose:
      - "80"
    depends_on:
      - backend

  # Point d'entree public unique (80/443), reverse-proxy vers frontend/backend
  # en interne. La config nginx elle-meme (server blocks, nom de domaine)
  # n'est pas versionnee ici : elle vit sur le VPS, dans
  # /opt/projet-elame/nginx/conf.d (a creer avant le premier demarrage).
  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/projet-elame/nginx/conf.d:/etc/nginx/conf.d
      - /opt/projet-elame/certbot/www:/var/www/certbot
      - /opt/projet-elame/certbot/conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend

  # Renouvellement des certificats Let's Encrypt utilises par nginx.
  certbot:
    image: certbot/certbot
    volumes:
      - /opt/projet-elame/certbot/www:/var/www/certbot
      - /opt/projet-elame/certbot/conf:/etc/letsencrypt

volumes:
  mysqldata:


