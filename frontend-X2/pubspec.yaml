name: frontend_flutter
description: Frontend Flutter Web NZELA-SERVICE - Architecture Microservices

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^13.2.0
  
  # Storage local (token JWT)
  shared_preferences: ^2.2.2
  
# UI
  flutter_svg: ^2.0.9
  loading_animation_widget: ^1.2.0+4
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lang/